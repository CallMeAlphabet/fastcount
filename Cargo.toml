[package]
name = "fastcount"
version = "2.0.0"
description = "an incredibly fast, incredibly useless counter"
license = "GPL-3.0-or-later"
repository = "https://github.com/CallMeAlphabet/fastcount"
edition = "2021"

[dependencies]
clihelp = "0.1"

[[bin]]
name = "fastcount"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
